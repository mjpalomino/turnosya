# docker-compose para desplegar TurnosYa en Coolify.
# El dominio HTTPS debe apuntar al servicio "web" (puerto 8080).
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-turnosya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-turnosya}
    volumes:
      - turnosya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-turnosya}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      APP_URL: ${APP_URL}
      DATABASE_URL: postgres://${POSTGRES_USER:-turnosya}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-turnosya}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      USER_ADMIN: ${USER_ADMIN}
      PASSWORD_ADMIN: ${PASSWORD_ADMIN}
      # Opcionales
      PLATFORM_WOMPI_PUBLIC_KEY: ${PLATFORM_WOMPI_PUBLIC_KEY:-}
      PLATFORM_WOMPI_INTEGRITY_SECRET: ${PLATFORM_WOMPI_INTEGRITY_SECRET:-}
      PLATFORM_WOMPI_EVENTS_SECRET: ${PLATFORM_WOMPI_EVENTS_SECRET:-}
      PLATFORM_WOMPI_ENVIRONMENT: ${PLATFORM_WOMPI_ENVIRONMENT:-test}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-TurnosYa <no-reply@turnosya.com>}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  turnosya_pgdata:

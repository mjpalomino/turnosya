# Config de nginx para servir la PWA Angular y proxear /api al backend.
# IMPORTANTE: NO redefinir un bloque `types { ... }` aquí: reemplazaría toda
# la tabla MIME y el navegador descargaría los .js/.css en vez de servirlos.
# Para tipos puntuales usar `types { ... }` SOLO dentro de su location, o default_type.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip básico
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # No cachear el service worker ni el index (para recibir updates).
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Assets con hash: cache largo.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API -> backend (servicio "api" en la red de Coolify).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: cualquier ruta devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
